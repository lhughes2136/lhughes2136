name: EMA 200 Crypto Daily Scan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    paths:
      - "ema200_scan.py"
      - ".github/workflows/ema200-daily.yml"
  schedule:
    # Regular daily runs at 08:05 America/New_York across DST.
    - cron: "5 12 * * *"
    - cron: "5 13 * * *"
    # One-time catch-up run for today's report (21:45 UTC, Aug 26).
    - cron: "45 21 26 8 *"

permissions:
  contents: write

concurrency:
  group: ema200-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether scheduled run is due
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          local = datetime.now(ZoneInfo("America/New_York"))
          catch_up = local.date().isoformat() == "2026-08-26" and local.hour == 17
          should_run = event != "schedule" or local.hour == 8 or catch_up
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if should_run else 'false'}\n")
          print(f"event={event} local={local.isoformat()} catch_up={catch_up} run={should_run}")
          PY

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --upgrade "requests>=2.31,<3" "pandas>=2.2,<3" "numpy>=1.26,<3"

      - name: Run completed-candle market scan
        if: steps.gate.outputs.run == 'true'
        env:
          EMA_MAX_SYMBOLS: "200"
          EMA_MIN_QUOTE_VOLUME: "5000000"
        run: python ema200_scan.py

      - name: Commit latest report and state
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "EMA200 Scan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update EMA 200 crypto scan $(date -u +%F)"
            git push
          fi

      - name: Upload report files
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ema200-crypto-scan
          path: |
            reports/latest_report.md
            reports/latest_signals.csv
            reports/latest_scan.json
          retention-days: 30
